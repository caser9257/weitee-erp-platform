--- #################### 服务保障相关配置 ####################

# Lock4j 配置�?
lock4j:
  acquire-timeout: 3000 # 获取分布式锁超时时间，默认为 3000 毫秒
  expire: 30000 # 分布式锁的超时时间，默认�?30 毫秒

