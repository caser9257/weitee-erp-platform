          #          url: jdbc:postgresql://127.0.0.1:5432/weitee-erp # PostgreSQL 连接的示�?
          #          url: jdbc:oracle:thin:@127.0.0.1:1521:xe # Oracle 连接的示�?
          #          url: jdbc:sqlserver://127.0.0.1:1433;DatabaseName=weitee-erp;SelectMethod=cursor;encrypt=false;rewriteBatchedStatements=true;useUnicode=true;characterEncoding=utf-8 # SQLServer 连接的示�?
          #          url: jdbc:dm://127.0.0.1:5236?schema=RUOYI_VUE_PRO # DM 连接的示�?
          #          url: jdbc:kingbase8://127.0.0.1:54321/test  # 人大金仓 KingbaseES 连接的示�?
          #          url: jdbc:postgresql://127.0.0.1:5432/postgres # OpenGauss 连接的示�?
          username: root
          password: 123456
