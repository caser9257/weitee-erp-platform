management:
  endpoints:
    web:
      base-path: /actuator # Actuator 提供�?API 接口的根目录。默认为 /actuator
      exposure:
        include: '*' # 需要开放的端点。默认值只打开 health �?info 两个端点。通过设置 * ，可以开放所有端点�?

