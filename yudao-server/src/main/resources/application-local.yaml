--- #################### 定时任务相关配置 ####################

# Quartz 配置项，对应 QuartzProperties 配置�?
spring:
  quartz:
    auto-startup: true # 本地开发环境，尽量不要开�?Job
    scheduler-name: schedulerName # Scheduler 名字。默认为 schedulerName
    job-store-type: jdbc # Job 存储器类型。默认为 memory 表示内存，可�?jdbc 使用数据库�?
    wait-for-jobs-to-complete-on-shutdown: true # 应用关闭时，是否等待定时任务执行完成。默认为 false ，建议设置为 true
    properties: # 添加 Quartz Scheduler 附加属性，更多可以�?http://www.quartz-scheduler.org/documentation/2.4.0-SNAPSHOT/configuration.html 文档
      org:
        quartz:
          # Scheduler 相关配置
          scheduler:
            instanceName: schedulerName
            instanceId: AUTO # 自动生成 instance ID
          # JobStore 相关配置
          jobStore:
            # JobStore 实现类。可见博客：https://blog.csdn.net/weixin_42458219/article/details/122247162
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            isClustered: true # 是集群模�?
            clusterCheckinInterval: 15000 # 集群检查频率，单位：毫秒。默认为 15000，即 15 �?
            misfireThreshold: 60000 # misfire 阀值，单位：毫秒�?
          # 线程池相关配�?
          threadPool:
            threadCount: 25 # 线程池大小。默认为 10 �?
            threadPriority: 5 # 线程优先�?
            class: org.quartz.simpl.SimpleThreadPool # 线程池类�?
    jdbc: # 使用 JDBC �?JobStore 的时候，JDBC 的配�?
      initialize-schema: NEVER # 是否自动使用 SQL 初始�?Quartz 表结构。这里设置成 never ，我们手动创建表结构�?

flowable:
  database-schema-update: false

