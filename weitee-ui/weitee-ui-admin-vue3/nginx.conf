server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 后端 API 代理
    location /admin-api/ {
        proxy_pass http://weitee-server:48080/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prod-api/ {
        proxy_pass http://weitee-server:48080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger API 文档代理
    location /doc.html {
        proxy_pass http://weitee-server:48080/doc.html;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://weitee-server:48080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /swagger-resources {
        proxy_pass http://weitee-server:48080/swagger-resources;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://weitee-server:48080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
