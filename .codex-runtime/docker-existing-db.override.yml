services:
  server:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: "-Xms512m -Xmx512m -Djava.security.egd=file:/dev/./urandom"
      TZ: Asia/Shanghai
      ARGS: |
        --spring.datasource.dynamic.datasource.master.url=jdbc:mysql://host.docker.internal:3306/weitee-erp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.master.username=root
        --spring.datasource.dynamic.datasource.master.password=123456
        --spring.datasource.dynamic.datasource.slave.url=jdbc:mysql://host.docker.internal:3306/weitee-erp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.slave.username=root
            --spring.datasource.dynamic.datasource.slave.password=123456
            --spring.redis.host=host.docker.internal
            --spring.redis.port=6379
            --spring.data.redis.host=host.docker.internal
            --spring.data.redis.port=6379
  admin:
    depends_on: []
