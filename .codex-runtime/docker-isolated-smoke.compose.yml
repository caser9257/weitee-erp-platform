name: weitee-smoke

services:
  mysql:
    container_name: weitee-smoke-mysql
    image: mysql:8.2.0
    restart: unless-stopped
    tty: true
    ports:
      - "13306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-weitee-erp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    volumes:
      - smoke-mysql-v2:/var/lib/mysql/
      - ../sql/mysql/base/quartz.sql:/docker-entrypoint-initdb.d/01-quartz.sql:ro
      - ../sql/mysql/base/weitee-erp.sql:/docker-entrypoint-initdb.d/02-weitee-erp.sql:ro
    networks:
      default:
        aliases:
          - weitee-mysql

  redis:
    container_name: weitee-smoke-redis
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes
    networks:
      default:
        aliases:
          - weitee-redis

  server:
    container_name: weitee-smoke-server
    build:
      context: ..
      dockerfile: weitee-server/Dockerfile
    image: weitee-server:smoke
    restart: unless-stopped
    ports:
      - "58080:48080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      TZ: Asia/Shanghai
      ARGS: |
        --spring.datasource.dynamic.datasource.master.url=${MASTER_DATASOURCE_URL:-jdbc:mysql://weitee-mysql:3306/weitee_erp_full2?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
        --spring.datasource.dynamic.datasource.master.username=${MASTER_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.master.password=${MASTER_DATASOURCE_PASSWORD:-123456}
        --spring.datasource.dynamic.datasource.slave.url=${SLAVE_DATASOURCE_URL:-jdbc:mysql://weitee-mysql:3306/weitee_erp_full2?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
        --spring.datasource.dynamic.datasource.slave.username=${SLAVE_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.slave.password=${SLAVE_DATASOURCE_PASSWORD:-123456}
        --spring.redis.host=${REDIS_HOST:-weitee-redis}
        --spring.redis.port=6379
        --spring.data.redis.host=${REDIS_HOST:-weitee-redis}
        --spring.data.redis.port=6379
        --flowable.database-schema-update=true
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      default:
        aliases:
          - weitee-server

  admin:
    container_name: weitee-smoke-admin
    build:
      context: ../weitee-ui/weitee-ui-admin-vue3
      args:
        NODE_ENV: ${NODE_ENV:-production}
    image: weitee-admin:smoke
    restart: unless-stopped
    ports:
      - "18080:80"
    depends_on:
      - server

volumes:
  smoke-mysql-v2:
    driver: local
  smoke-redis:
    driver: local
