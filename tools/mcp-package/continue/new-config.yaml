name: Weitee MCP Config
version: 1.0.0
schema: v1

models:
  - name: my gpt-5
    provider: openai
    model: gpt-5
    apiKey: YOUR_OPENAI_API_KEY_HERE

mcpServers:
  - name: weitee-mcp-sse
    command: npx
    args:
      - mcp-remote
      - http://127.0.0.1:48080/sse

  - uses: anthropic/memory-mcp
