services:
  mysql:
    container_name: scm-iqc-source-20260718-mysql
    ports: !override
      - "23313:3306"
    volumes:
      - scm-iqc-source-20260718-mysql:/var/lib/mysql/
      - ../../sql/mysql/base/quartz.sql:/docker-entrypoint-initdb.d/01-quartz.sql:ro
      - ../../production/ruoyi-vue-pro/weitee-erp_backup_20260709.sql:/docker-entrypoint-initdb.d/02-weitee-erp.sql:ro
      - ./initdb/03-weitee-post-import-fixes.sql:/docker-entrypoint-initdb.d/03-weitee-post-import-fixes.sql:ro
      - ./initdb/04-demo-accounts.sql:/docker-entrypoint-initdb.d/07-demo-accounts.sql:ro
      - ../../sql/mysql/purchase/164-erp-purchase-source-batch-query-permission.sql:/docker-entrypoint-initdb.d/08-erp-purchase-source-batch-query-permission.sql:ro
      - ../../sql/mysql/system/165-purchase-approval-task-permission.sql:/docker-entrypoint-initdb.d/09-purchase-approval-task-permission.sql:ro
      - ../../sql/mysql/purchase/166-erp-purchase-in-bpm-platform.sql:/docker-entrypoint-initdb.d/10-erp-purchase-in-bpm-platform.sql:ro
      - ../../sql/mysql/purchase/167-erp-purchase-return-bpm-platform.sql:/docker-entrypoint-initdb.d/11-erp-purchase-return-bpm-platform.sql:ro
      - ../../sql/mysql/manufacturing/169-erp-production-return-page-permission.sql:/docker-entrypoint-initdb.d/13-erp-production-return-page-permission.sql:ro
      - ../../sql/mysql/system/170-finance-voucher-experience-permission.sql:/docker-entrypoint-initdb.d/14-finance-voucher-experience-permission.sql:ro
      - ../../sql/mysql/system/171-stock-out-bpm-experience-permission.sql:/docker-entrypoint-initdb.d/15-stock-out-bpm-experience-permission.sql:ro

  redis:
    container_name: scm-iqc-source-20260718-redis
    ports: !override
      - "26385:6379"

  server:
    container_name: scm-iqc-source-20260718-server
    image: scm-iqc-source-20260718-server
    ports: !override
      - "58088:48080"
    networks:
      default:
        aliases:
          - weitee-server
    environment:
      ARGS: |
        --spring.datasource.dynamic.datasource.master.url=jdbc:mysql://mysql:3306/weitee-erp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.master.username=root
        --spring.datasource.dynamic.datasource.master.password=123456
        --spring.datasource.dynamic.datasource.slave.url=jdbc:mysql://mysql:3306/weitee-erp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.slave.username=root
        --spring.datasource.dynamic.datasource.slave.password=123456
        --spring.redis.host=redis
        --spring.redis.port=6379
        --spring.data.redis.host=redis
        --spring.data.redis.port=6379

volumes:
  scm-iqc-source-20260718-mysql:
    driver: local
