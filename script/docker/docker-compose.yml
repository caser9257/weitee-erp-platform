version: "3.4"

name: weitee-system

services:
  mysql:
    container_name: weitee-mysql
    image: mysql:8
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-weitee-erp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    volumes:
      - mysql:/var/lib/mysql/
      - ../../sql/mysql/base/quartz.sql:/docker-entrypoint-initdb.d/01-quartz.sql:ro
      - ../../sql/mysql/base/weitee-erp.sql:/docker-entrypoint-initdb.d/02-weitee-erp.sql:ro

  redis:
    container_name: weitee-redis
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  server:
    container_name: weitee-server
    build:
      context: ../../weitee-server
    image: weitee-server
    restart: unless-stopped
    ports:
      - "48080:48080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: ${JAVA_OPTS:-"-Xms512m -Xmx512m -Djava.security.egd=file:/dev/./urandom"}
      TZ: Asia/Shanghai
      ARGS: |
        --spring.datasource.dynamic.datasource.master.url=${MASTER_DATASOURCE_URL:-jdbc:mysql://weitee-mysql:3306/weitee-erp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
        --spring.datasource.dynamic.datasource.master.username=${MASTER_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.master.password=${MASTER_DATASOURCE_PASSWORD:-123456}
        --spring.datasource.dynamic.datasource.slave.url=${SLAVE_DATASOURCE_URL:-jdbc:mysql://weitee-mysql:3306/weitee-erp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
        --spring.datasource.dynamic.datasource.slave.username=${SLAVE_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.slave.password=${SLAVE_DATASOURCE_PASSWORD:-123456}
        --spring.redis.host=${REDIS_HOST:-weitee-redis}
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started

  admin:
    container_name: weitee-admin
    build:
      context: ../../weitee-ui/weitee-ui-admin-vue3
      args:
        NODE_ENV: ${NODE_ENV:-production}
    image: weitee-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mysql:
    driver: local
  redis:
    driver: local
