name: scm-zip-source-20260719

services:
  mysql:
    container_name: scm-zip-source-20260719-mysql
    ports: !override
      - "23314:3306"
    volumes: !override
      - scm-zip-source-20260719-mysql:/var/lib/mysql/
      - ../../sql/mysql/base/quartz.sql:/docker-entrypoint-initdb.d/01-quartz.sql:ro
      - ../../production/ruoyi-vue-pro/weitee-erp_backup_20260709.sql:/docker-entrypoint-initdb.d/02-weitee-erp.sql:ro
      - ./initdb/03-weitee-post-import-fixes.sql:/docker-entrypoint-initdb.d/03-weitee-post-import-fixes.sql:ro
      - ../../sql/mysql/stock/143-erp-stock-assemble.sql:/docker-entrypoint-initdb.d/05-erp-stock-assemble.sql:ro
      - ../../sql/mysql/stock/144-erp-product-unit-quantity-precision.sql:/docker-entrypoint-initdb.d/06-erp-product-unit-quantity-precision.sql:ro
      - ../../sql/mysql/stock/160-erp-stock-move-bpm.sql:/docker-entrypoint-initdb.d/06-erp-stock-move-bpm.sql:ro
      - ./initdb/04-demo-accounts.sql:/docker-entrypoint-initdb.d/08-demo-accounts.sql:ro
      - ../../sql/mysql/purchase/164-erp-purchase-source-batch-query-permission.sql:/docker-entrypoint-initdb.d/09-purchase-source-batch-query-permission.sql:ro
      - ../../sql/mysql/system/165-purchase-approval-task-permission.sql:/docker-entrypoint-initdb.d/10-purchase-approval-task-permission.sql:ro
      - ../../sql/mysql/purchase/166-erp-purchase-in-bpm-platform.sql:/docker-entrypoint-initdb.d/11-purchase-in-bpm-platform.sql:ro
      - ../../sql/mysql/purchase/167-erp-purchase-return-bpm-platform.sql:/docker-entrypoint-initdb.d/12-purchase-return-bpm-platform.sql:ro
      - ../../sql/mysql/sale/168-erp-sale-order-bpm-platform.sql:/docker-entrypoint-initdb.d/12-sale-order-bpm-platform.sql:ro
      - ../../sql/mysql/manufacturing/169-erp-production-return-page-permission.sql:/docker-entrypoint-initdb.d/13-production-return-page-permission.sql:ro
      - ../../sql/mysql/system/170-finance-voucher-experience-permission.sql:/docker-entrypoint-initdb.d/14-finance-voucher-experience-permission.sql:ro
      - ../../sql/mysql/system/171-stock-out-bpm-experience-permission.sql:/docker-entrypoint-initdb.d/15-stock-out-bpm-experience-permission.sql:ro

  redis:
    container_name: scm-zip-source-20260719-redis
    ports: !override
      - "26386:6379"

  server:
    container_name: scm-zip-source-20260719-server
    image: scm-zip-source-20260719-server
    ports: !override
      - "58089:48080"
    networks:
      default:
        aliases:
          - weitee-server
    environment:
      ARGS: |
        --spring.datasource.dynamic.datasource.master.url=jdbc:mysql://mysql:3306/weitee-erp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.master.username=root
        --spring.datasource.dynamic.datasource.master.password=123456
        --spring.datasource.dynamic.datasource.slave.url=jdbc:mysql://mysql:3306/weitee-erp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.slave.username=root
        --spring.datasource.dynamic.datasource.slave.password=123456
        --spring.redis.host=redis
        --spring.redis.port=6379
        --spring.data.redis.host=redis
        --spring.data.redis.port=6379

  admin:
    container_name: scm-zip-source-20260719-admin
    image: scm-zip-source-20260719-admin
    ports: !override
      - "28084:80"
    build:
      args:
        NODE_MAX_OLD_SPACE_SIZE: "3072"
        VITE_APP_CAPTCHA_ENABLE: "false"

volumes:
  scm-zip-source-20260719-mysql:
    driver: local
